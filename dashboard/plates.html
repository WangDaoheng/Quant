<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>板块轮动分析 - A股情绪仪表盘</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 20px;
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
            border-radius: 12px;
            border: 1px solid #30363d;
        }
        .header h1 { font-size: 24px; color: #f0f6fc; }
        .header .date { font-size: 13px; color: #8b949e; margin-top: 4px; }
        .nav-btn {
            padding: 8px 16px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #58a6ff;
            text-decoration: none;
            font-size: 13px;
            transition: all 0.2s;
        }
        .nav-btn:hover { background: #30363d; border-color: #58a6ff; }

        .info-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 16px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            font-size: 13px;
        }
        .info-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .info-item .label { color: #8b949e; }
        .info-item .value { color: #f0f6fc; font-weight: 600; }
        .info-item .value.up { color: #f85149; }

        .chart-section {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .chart-title {
            font-size: 14px;
            color: #8b949e;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
        }
        .chart-title .hint { font-size: 11px; color: #58a6ff; }
        .chart-container {
            width: 100%;
            height: 450px;
        }
        .chart-container.bar-chart {
            height: 500px;
        }

        .footer {
            text-align: center;
            color: #8b949e;
            font-size: 11px;
            margin-top: 20px;
            padding: 16px;
            border-top: 1px solid #30363d;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #8b949e;
        }
        .error {
            text-align: center;
            padding: 40px;
            color: #f85149;
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>📈 板块轮动分析</h1>
            <div class="date" id="dataDate">数据加载中...</div>
        </div>
        <a href="index.html" class="nav-btn">← 返回情绪仪表盘</a>
    </div>

    <div id="loading" class="loading">正在加载数据...</div>
    <div id="error" class="error" style="display: none;"></div>

    <div id="content" style="display: none;">
        <div class="info-bar">
            <div class="info-item">
                <span class="label">当前选中日期：</span>
                <span class="value up" id="selectedDate">--</span>
            </div>
            <div class="info-item">
                <span class="label">当日TOP1：</span>
                <span class="value up" id="top1Plate">--</span>
            </div>
            <div class="info-item">
                <span class="label">提示：</span>
                <span class="value" style="font-weight: normal; color: #8b949e;">点击上方气泡图任意位置，下方柱状图显示当日TOP20</span>
            </div>
        </div>

        <!-- 气泡矩阵图 -->
        <div class="chart-section">
            <div class="chart-title">
                <span>概念板块涨幅气泡矩阵（每日TOP20）</span>
                <span class="hint">点大小=板块总市值 | 点击任意位置选中日期</span>
            </div>
            <div id="bubbleChart" class="chart-container"></div>
        </div>

        <!-- 当日TOP20柱状图 -->
        <div class="chart-section">
            <div class="chart-title">
                <span id="barTitle">-- 当日涨幅TOP20板块</span>
                <span class="hint">红=上涨，绿=下跌</span>
            </div>
            <div id="barChart" class="chart-container bar-chart"></div>
        </div>
    </div>

    <div class="footer">
        数据来源：quant 数据库 | 生成文件：data_jsons/plates.json
    </div>

    <script>
        // 全局数据
        let platesData = null;
        let bubbleChart = null;
        let barChart = null;

        // 加载数据
        fetch('./data_jsons/plates.json')
            .then(res => {
                if (!res.ok) throw new Error('plates.json 不存在，请先运行 dapan_qingxu.py');
                return res.json();
            })
            .then(data => {
                platesData = data;
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                renderAll(data);
            })
            .catch(err => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = '数据加载失败：' + err.message;
            });

        function renderAll(data) {
            document.getElementById('dataDate').textContent =
                `数据日期：${data.meta.date_range[1]} | 生成时间：${data.meta.generated_at}`;

            // 检查是否有板块数据
            if (!data.daily_top20 || Object.keys(data.daily_top20).length === 0) {
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = '板块数据为空，Python脚本暂未实现板块数据拉取';
                return;
            }

            renderBubbleChart(data.daily_top20);

            // 默认显示最新日期
            const dates = Object.keys(data.daily_top20).sort();
            const lastDate = dates[dates.length - 1];
            renderBarChart(lastDate, data.daily_top20[lastDate]);
        }

        function renderBubbleChart(dailyTop20) {
            const dates = Object.keys(dailyTop20).sort();
            const allPlates = new Set();

            // 收集所有板块
            dates.forEach(date => {
                dailyTop20[date].forEach(p => allPlates.add(p.name));
            });

            // 生成颜色映射
            const colors = ['#f85149', '#58a6ff', '#3fb950', '#d29922', '#bc8cff', '#ff7b72',
                           '#76e3ea', '#ffa657', '#7ee787', '#a5d6ff', '#ff9bce', '#fff8c5',
                           '#f0f6fc', '#9e6a03', '#da3633', '#1f6feb', '#8250df', '#cf222e',
                           '#bf8700', '#57606a', '#1b7c83', '#4c1d95', '#78350f', '#374151', '#b45309'];

            const colorMap = {};
            Array.from(allPlates).forEach((name, i) => {
                colorMap[name] = colors[i % colors.length];
            });

            // 构建气泡数据
            const series = [];
            const plateNames = Array.from(allPlates);

            plateNames.forEach(plateName => {
                const plateData = [];
                dates.forEach((date, dayIdx) => {
                    const dayData = dailyTop20[date];
                    const plate = dayData.find(p => p.name === plateName);
                    if (plate) {
                        plateData.push([
                            dayIdx,
                            plate.change,
                            plate.market_cap || 500, // 默认市值
                            plateName
                        ]);
                    }
                });

                if (plateData.length > 0) {
                    series.push({
                        name: plateName,
                        type: 'scatter',
                        data: plateData,
                        symbolSize: function(data) {
                            return Math.sqrt(data[2]) / 2.5;
                        },
                        itemStyle: {
                            color: colorMap[plateName],
                            opacity: 0.65,
                            borderColor: '#fff',
                            borderWidth: 0.5
                        },
                        emphasis: {
                            itemStyle: { opacity: 1, borderWidth: 2 }
                        }
                    });
                }
            });

            bubbleChart = echarts.init(document.getElementById('bubbleChart'));
            bubbleChart.setOption({
                tooltip: {
                    backgroundColor: '#1c2128',
                    borderColor: '#30363d',
                    textStyle: { color: '#c9d1d9' },
                    formatter: function(params) {
                        const d = params.data;
                        return `<b>${d[3]}</b><br/>
                                日期：${dates[d[0]]}<br/>
                                涨幅：<span style="color:#f85149">${d[1]}%</span><br/>
                                总市值：${(d[2]/100).toFixed(0)}亿`;
                    }
                },
                legend: {
                    data: plateNames,
                    textStyle: { color: '#8b949e', fontSize: 10 },
                    top: 0,
                    type: 'scroll'
                },
                grid: { left: '3%', right: '4%', bottom: '12%', top: '12%', containLabel: true },
                xAxis: {
                    type: 'category',
                    data: dates.map(d => d.substring(4, 6) + '/' + d.substring(6, 8)),
                    axisLine: { lineStyle: { color: '#30363d' } },
                    axisLabel: { color: '#8b949e', fontSize: 9, interval: 4 }
                },
                yAxis: {
                    type: 'value',
                    name: '当日涨幅(%)',
                    axisLine: { lineStyle: { color: '#30363d' } },
                    axisLabel: { color: '#8b949e', formatter: '{value}%' },
                    splitLine: { lineStyle: { color: '#21262d' } }
                },
                dataZoom: [
                    { type: 'inside' },
                    { type: 'slider', height: 20, bottom: 0, borderColor: '#30363d', backgroundColor: '#161b22', fillerColor: 'rgba(88,166,255,0.2)', textStyle: { color: '#8b949e' } }
                ],
                series: series
            });

            // 点击切换日期
            bubbleChart.on('click', function(params) {
                if (params.data && params.data[0] !== undefined) {
                    const date = dates[params.data[0]];
                    renderBarChart(date, dailyTop20[date]);
                }
            });
        }

        function renderBarChart(date, top20) {
            document.getElementById('selectedDate').textContent =
                date.substring(4, 6) + '/' + date.substring(6, 8);
            document.getElementById('top1Plate').textContent =
                top20.length > 0 ? `${top20[0].name} +${top20[0].change}%` : '无数据';
            document.getElementById('barTitle').textContent =
                `${date.substring(4, 6)}/${date.substring(6, 8)} 当日涨幅TOP20板块`;

            barChart = echarts.init(document.getElementById('barChart'));
            barChart.setOption({
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'shadow' },
                    backgroundColor: '#1c2128',
                    borderColor: '#30363d',
                    textStyle: { color: '#c9d1d9' },
                    formatter: function(params) {
                        const p = params[0];
                        const data = top20[p.dataIndex];
                        return `<b>${data.name}</b><br/>
                                涨幅：${data.change}%<br/>
                                总市值：${((data.market_cap || 500)/100).toFixed(0)}亿`;
                    }
                },
                grid: { left: '3%', right: '8%', bottom: '3%', containLabel: true },
                xAxis: {
                    type: 'value',
                    axisLabel: { color: '#8b949e', formatter: '{value}%' },
                    splitLine: { lineStyle: { color: '#21262d' } }
                },
                yAxis: {
                    type: 'category',
                    data: top20.map(d => d.name).reverse(),
                    axisLine: { lineStyle: { color: '#30363d' } },
                    axisLabel: { color: '#c9d1d9', fontSize: 12 }
                },
                series: [{
                    type: 'bar',
                    data: top20.map(d => ({
                        value: d.change,
                        itemStyle: { color: d.change >= 0 ? '#f85149' : '#3fb950' }
                    })).reverse(),
                    label: {
                        show: true,
                        position: 'right',
                        color: '#8b949e',
                        formatter: '{c}%'
                    },
                    barWidth: '60%'
                }]
            });
        }

        // 响应式
        window.addEventListener('resize', () => {
            if (bubbleChart) bubbleChart.resize();
            if (barChart) barChart.resize();
        });
    </script>
</body>
</html>
